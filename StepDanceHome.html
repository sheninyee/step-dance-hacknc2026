      <script>
        // The text you want to type out
        const titleText = "Step Dance !! ";
        let index = 0;

        function typeTitle() {
            // Update the browser title with a substring of the text
            document.title = titleText.substring(0, index + 1);
            index++;

            // Reset the loop once the full text is typed out
            if (index >= titleText.length) {
                index = 0; 
                // Optional delay before restarting the loop
                setTimeout(typeTitle, 2000); 
            } else {
                // Speed of typing (in milliseconds)
                setTimeout(typeTitle, 200); 
            }
        }

        // Start the effect when the page loads
        window.onload = typeTitle;
    </script>
