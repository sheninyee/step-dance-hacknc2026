<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="js/voice-ui.css" />
  <script src="js/page-coach.js" type="module"></script>
  <link rel="icon" href="https://file.garden/Ze88s1ucmRDZDhMX/pixels/372.gif" type="image/x-icon">
</head>
<body data-coach-page="settings">

  <!-- Floating Clouds Layer -->
  <div class="clouds-container" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
  </div>

  <!-- Background Bubble Effect Canvas -->
  <canvas id="bubble-canvas"></canvas>

  <!-- Sliding Menu Container -->
  <div class="menu-container" id="menuContainer">
    <!-- Logo -->
    <h1 class="menu-logo" id="menuLogo">STEP DANCE</h1>

    <!-- Menu Options -->
    <nav class="menu-list">
      <a href="songs.html" class="menu-item">Songlist</a>
      <button type="button" class="menu-item resume-btn" id="resumeBtn">Resume</button>
      <a href="StepDanceHome.html" class="menu-item" id="resetBtn">Reset Stage</a>
      <button type="button" class="menu-item" id="solanaButton">Save practice on Solana</button>
      <p id="solanaStatus"></p>
    </nav>
  </div>

  <!-- Tree Line Layer (Behind Text) -->
  <div class="trees-layer" aria-hidden="true">
    <img src="images/trees.png" alt="Trees" class="trees-img" />
  </div>

  <script>
    // --- 1. Float Letter Effect for Logo ---
    const logo = document.getElementById('menuLogo');
    if (logo) {
      logo.innerHTML = [...logo.textContent]
        .map((char, i) => `<span class="char" style="--char-index:${i}">${char === ' ' ? '&nbsp;' : char}</span>`)
        .join('');
    }

    // --- 2. Slide Out & Resume Previous Page ---
    const resumeBtn = document.getElementById('resumeBtn');
    const menuContainer = document.getElementById('menuContainer');

    if (resumeBtn && menuContainer) {
      resumeBtn.addEventListener('click', () => {
        menuContainer.classList.add('slide-out');

        setTimeout(() => {
          if (document.referrer && document.referrer !== window.location.href) {
            window.location.href = document.referrer;
          } else if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = 'StepDanceHome.html';
          }
        }, 400);
      });
    }

    // --- 3. Interactive Bubble Cursor Effect ---
    const canvas = document.getElementById('bubble-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      class Bubble {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = Math.random() * 12 + 6;
          this.speedX = (Math.random() - 0.5) * 1.5;
          this.speedY = (Math.random() - 0.5) * 1.5 - 1.2;
          this.opacity = 0.85;
          this.fade = Math.random() * 0.015 + 0.01;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.opacity -= this.fade;
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.opacity);
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(170, 220, 255, 0.4)';
          ctx.fill();
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.stroke();
          ctx.restore();
        }
      }

      window.addEventListener('mousemove', (e) => {
        for (let i = 0; i < 2; i++) {
          particles.push(new Bubble(e.clientX, e.clientY));
        }
      });

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].opacity <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animate);
      }
      animate();
    }
  </script>
  <script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
  <script src="js/solana.js"></script>
</body>
</html>
