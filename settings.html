<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>

  <!-- Background Bubble Effect Canvas -->
  <canvas id="bubble-canvas"></canvas>

  <!-- Sliding Menu Container -->
  <div class="menu-container" id="menuContainer">
    <!-- Logo -->
    <h1 class="menu-logo menu-logo--float">STEP DANCE</h1>

    <!-- Menu Options -->
    <nav class="menu-list">
      <a href="songlist.html" class="menu-item">Songlist</a>
      <button type="button" class="menu-item resume-btn" id="resumeBtn">Resume</button>
      <a href="StepDanceHome.html" class="menu-item">Reset Stage</a>
    </nav>
  </div>

  <!-- Swaying Grass Layer -->
  <div class="grass-layer" aria-hidden="true">
    <svg class="grass-blade grass-1" viewBox="0 0 40 120" preserveAspectRatio="none">
      <path d="M15,120 C18,70 5,30 20,0 C32,35 25,75 25,120 Z" fill="#7cb342" />
    </svg>
    <svg class="grass-blade grass-2" viewBox="0 0 40 120" preserveAspectRatio="none">
      <path d="M12,120 C22,65 35,25 25,0 C12,30 18,70 18,120 Z" fill="#8bc34a" />
    </svg>
    <svg class="grass-blade grass-3" viewBox="0 0 40 120" preserveAspectRatio="none">
      <path d="M16,120 C10,60 5,20 28,0 C22,35 26,75 24,120 Z" fill="#689f38" />
    </svg>
    <svg class="grass-blade grass-4" viewBox="0 0 40 120" preserveAspectRatio="none">
      <path d="M14,120 C24,70 30,30 18,0 C12,35 18,80 20,120 Z" fill="#9ccc65" />
    </svg>
    <svg class="grass-blade grass-5" viewBox="0 0 40 120" preserveAspectRatio="none">
      <path d="M18,120 C14,65 8,25 22,0 C26,30 22,75 22,120 Z" fill="#7cb342" />
    </svg>
    <svg class="grass-blade grass-6" viewBox="0 0 40 120" preserveAspectRatio="none">
      <path d="M12,120 C20,60 32,20 20,0 C14,35 16,75 18,120 Z" fill="#8bc34a" />
    </svg>
  </div>

  <script>
    // --- 1. Slide Out & Resume Previous Page ---
    const resumeBtn = document.getElementById('resumeBtn');
    const menuContainer = document.getElementById('menuContainer');

    resumeBtn.addEventListener('click', () => {
      // Trigger the slide-out CSS transition
      menuContainer.classList.add('slide-out');

      // Wait for the slide-out animation to finish before going back
      setTimeout(() => {
        if (document.referrer && document.referrer !== window.location.href) {
          window.location.href = document.referrer;
        } else if (window.history.length > 1) {
          window.history.back();
        } else {
          // Fallback if opened directly in a new tab
          window.location.href = 'StepDanceHome.html';
        }
      }, 400);
    });

    // Reset Stage button handler
    document.getElementById('resetBtn').addEventListener('click', () => {
      // Logic for stage restart or reload
      window.location.href = 'StepDanceHome.html';
    });

    // --- 2. Bubble Cursor Effect ---
    const canvas = document.getElementById('bubble-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Bubble {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 10 + 5;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.speedY = (Math.random() - 0.5) * 1.5 - 1.2;
        this.opacity = 0.9;
        this.fade = Math.random() * 0.02 + 0.01;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.opacity -= this.fade;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(170, 220, 255, 0.45)';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.stroke();
        ctx.restore();
      }
    }

    window.addEventListener('mousemove', (e) => {
      for (let i = 0; i < 2; i++) {
        particles.push(new Bubble(e.clientX, e.clientY));
      }
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
