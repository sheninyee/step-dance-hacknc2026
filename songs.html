<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Songlist</title>
  <link rel="icon" href="https://file.garden/Ze88s1ucmRDZDhMX/pixels/372.gif" type="image/x-icon">
  <link rel="stylesheet" href="songs.css">
</head>
<body>

  <!-- Floating Clouds Background -->
  <div class="clouds-container" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
  </div>

  <!-- CD Player (Floating in Top-Right Corner) -->
  <aside class="cd-player" id="cd-player" aria-label="CD player">
    <div class="cd-player-brand"><span>STEP DANCE</span><span>CD-01</span></div>
    <div class="cd-case" aria-hidden="true">
      <img class="cd-disc" src="images/cd.png" width="190" height="189" alt="">
      <img class="cd-cover" id="cd-cover" src="images/world_is_mine.webp" width="200" height="200" alt="">
      <span class="cd-hinge"></span>
    </div>
    <div class="cd-display">
      <div class="cd-display-status">
        <span class="cd-led" aria-hidden="true"></span>
        <span id="cd-state">STOPPED</span>
        <span class="cd-format">STEREO</span>
      </div>
      <p id="cd-song">World Is Mine</p>
    </div>
    <div class="cd-player-footer" aria-hidden="true"><span>DIGITAL AUDIO</span><span class="cd-speaker"></span></div>
  </aside>

  <!-- Main Aero Glass Song Panel -->
  <main class="song-panel" aria-labelledby="page-title">
    <header class="song-heading">
      <div class="heading-left">
        <a class="home-link" href="StepDanceHome.html">← Home</a>
        <h1 id="page-title">Songs List</h1>
      </div>
    </header>

    <section class="song-list" aria-label="Choose a song">
      <article class="song-row selected song-world" data-song="World Is Mine" data-artist="ryo (supercell)" data-preview="audio/world_is_mine.mp3">
        <button class="song-select" type="button" aria-pressed="true">
          <img class="album-art" src="images/world_is_mine.webp" alt="">
          <span class="song-name">World Is Mine <small>Hatsune Miku · ryo</small></span>
        </button>
      </article>

      <article class="song-row song-shake" data-song="Shake It Off" data-artist="Taylor Swift" data-preview="audio/shake_it_off.mp3">
        <button class="song-select" type="button" aria-pressed="false">
          <img class="album-art" src="images/shake_it_off.jpeg" alt="">
          <span class="song-name">Shake It Off <small>Taylor Swift</small></span>
        </button>
      </article>

      <article class="song-row song-tell" data-song="Tell Your World" data-artist="livetune" data-preview="audio/tell_your_world.mp3">
        <button class="song-select" type="button" aria-pressed="false">
          <img class="album-art" src="images/tell_your_world.jpg" alt="">
          <span class="song-name">Tell Your World <small>Hatsune Miku · livetune</small></span>
        </button>
      </article>
    </section>

    <!-- Voice Coach Section -->
    <section class="voice-coach" aria-label="Coach conversation">
      <div class="coach-start-controls">
        <button class="coach-button" id="coach-button" type="button" aria-pressed="false">Start voice coach</button>
        <p id="coach-start-hint">Press space bar to start the voice coach</p>
      </div>
      <div class="coach-copy">
        <p id="coach-status" role="status">Select a song to practice your dance moves.</p>
      </div>
    </section>

    <!-- Big Action Button -->
    <button class="dance-button" id="dance-button" type="button">DANCE</button>
    <p class="status" id="status" role="status" aria-live="polite">Hover over a song to hear a preview</p>
  </main>

  <audio id="preview-player" preload="none"></audio>

  <!-- Complete Standalone Controller Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cdPlayer = document.getElementById('cd-player');
      const cdCover = document.getElementById('cd-cover');
      const cdSong = document.getElementById('cd-song');
      const cdState = document.getElementById('cd-state');
      const statusEl = document.getElementById('status');
      const previewPlayer = document.getElementById('preview-player');
      const songRows = document.querySelectorAll('.song-row');
      const danceBtn = document.getElementById('dance-button');

      let currentSelectedRow = document.querySelector('.song-row.selected') || songRows[0];

      // Save initial song
      localStorage.setItem('selectedSong', currentSelectedRow.dataset.song);
      localStorage.setItem('selectedAudio', currentSelectedRow.dataset.preview);

      function applySongToCD(row, isPlaying = true) {
        const songTitle = row.dataset.song;
        const artist = row.dataset.artist;
        const img = row.querySelector('.album-art');

        if (img && cdCover) cdCover.src = img.src;
        if (cdSong) cdSong.textContent = songTitle;
        if (statusEl) statusEl.textContent = `Selected: ${songTitle} (${artist})`;

        if (isPlaying) {
          if (cdState) cdState.textContent = 'PLAYING';
          cdPlayer.classList.add('is-playing');

          if (row.dataset.preview && previewPlayer) {
            if (previewPlayer.src !== row.dataset.preview) {
              previewPlayer.src = row.dataset.preview;
            }
            previewPlayer.play().catch(() => {});
          }
        }
      }

      function stopCD() {
        if (cdState) cdState.textContent = 'STOPPED';
        cdPlayer.classList.remove('is-playing');
        if (previewPlayer) previewPlayer.pause();
        if (statusEl) statusEl.textContent = 'Hover over a song to hear a preview';
      }

      songRows.forEach((row) => {
        // Hover preview
        row.addEventListener('mouseenter', () => {
          applySongToCD(row, true);
        });

        // Mouse leave
        row.addEventListener('mouseleave', () => {
          if (currentSelectedRow && currentSelectedRow !== row) {
            applySongToCD(currentSelectedRow, false);
            cdPlayer.classList.remove('is-playing');
            if (cdState) cdState.textContent = 'STOPPED';
          } else {
            stopCD();
          }
        });

        // Click selection
        row.addEventListener('click', (e) => {
          e.preventDefault();
          songRows.forEach(r => {
            r.classList.remove('selected');
            const btn = r.querySelector('.song-select');
            if (btn) btn.setAttribute('aria-pressed', 'false');
          });

          row.classList.add('selected');
          const btn = row.querySelector('.song-select');
          if (btn) btn.setAttribute('aria-pressed', 'true');

          currentSelectedRow = row;
          localStorage.setItem('selectedSong', row.dataset.song);
          localStorage.setItem('selectedAudio', row.dataset.preview);

          applySongToCD(row, true);
        });
      });

      // Navigate with chosen song to practice.html
      if (danceBtn) {
        danceBtn.addEventListener('click', () => {
          if (previewPlayer) previewPlayer.pause();
          const songTitle = currentSelectedRow?.dataset.song || 'World Is Mine';
          const audioSrc = currentSelectedRow?.dataset.preview || 'audio/world_is_mine.mp3';

          localStorage.setItem('selectedSong', songTitle);
          localStorage.setItem('selectedAudio', audioSrc);

          window.location.href = `practice.html?song=${encodeURIComponent(songTitle)}&audio=${encodeURIComponent(audioSrc)}`;
        });
      }
    });
  </script>
</body>
</html>
